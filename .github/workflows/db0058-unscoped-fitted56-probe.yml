name: Source58 fresh unscoped DB0056 fitted owner probe

on:
  push:
    branches: [work/db0058-unscoped-fitted56-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unscoped-fitted56-owner:
    if: github.ref == 'refs/heads/work/db0058-unscoped-fitted56-probe'
    name: Disposable DB0056 TLS owner structure and ACL drift
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic topic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise the single fixed PostgreSQL case and verify archived evidence
        shell: bash
        run: |
          set -euo pipefail
          subject=90f2a714bc31a7833579ee112b64619c31bea5d8
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$subject" "$commit"
          diff -u <(printf '%s\n' \
            .github/workflows/db0058-unscoped-fitted56-probe.yml MANIFEST.sha256 \
            scripts/run_retained0017_reference_probe_v1.py) \
            <(git diff --name-only "$subject" "$commit")
          python3 scripts/manifest.py --check
          tree=$(git rev-parse 'HEAD^{tree}')
          archive="$RUNNER_TEMP/ctcc-source.tar"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output="$archive" "$commit"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          options=(--archive "$archive" --archive-sha256 "$digest" --commit "$commit" --tree "$tree"
            --unscoped-fitted56-owner-acl --output "$RUNNER_TEMP/ctcc-unscoped-fitted56-owner")
          python3 -m scripts.run_retained0017_reference_probe_v1 "${options[@]}"
          python3 -m scripts.run_retained0017_reference_probe_v1 "${options[@]}" --verify-only
      - name: Preserve exact source, single-case JUnit and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctcc-unscoped-fitted56-owner-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ctcc-source.tar
            ${{ runner.temp }}/ctcc-unscoped-fitted56-owner/*.json
            ${{ runner.temp }}/ctcc-unscoped-fitted56-owner/*.log
            ${{ runner.temp }}/ctcc-unscoped-fitted56-owner/test-results/*.xml
          if-no-files-found: error
          retention-days: 30
