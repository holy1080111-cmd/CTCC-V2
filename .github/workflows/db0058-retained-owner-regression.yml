name: DB0058 retained owner regression

on:
  push:
    branches: [work/db0058-retained-owner-regression]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-owner-regression:
    if: github.ref == 'refs/heads/work/db0058-retained-owner-regression'
    name: Exact source retained owner PostgreSQL component 3
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run complete unchanged retained owner component
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          tree=$(git rev-parse 'HEAD^{tree}')
          archive="$RUNNER_TEMP/ctcc-source.tar"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output="$archive" "$commit"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          python3 -m scripts.verify_current0058_full_hermetic \
            --archive "$archive" --archive-sha256 "$digest" \
            --commit "$commit" --tree "$tree" \
            --suite postgres --postgres-component-index 3 \
            --output "$RUNNER_TEMP/ctcc-retained-owner58-regression"

      - name: Preserve exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctcc-retained-owner58-regression-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ctcc-source.tar
            ${{ runner.temp }}/ctcc-retained-owner58-regression/*.json
            ${{ runner.temp }}/ctcc-retained-owner58-regression/*.log
            ${{ runner.temp }}/ctcc-retained-owner58-regression/test-results/*.xml
            ${{ runner.temp }}/ctcc-retained-owner58-regression/test-results/*.json
            ${{ runner.temp }}/ctcc-retained-owner58-regression/test-results/*.log
          if-no-files-found: error
          retention-days: 30
