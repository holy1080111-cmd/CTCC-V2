name: Source58 fresh owned Paper runtime

on:
  push:
    branches: [work/db0058-paper58-owned-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-paper-runtime:
    if: github.ref == 'refs/heads/work/db0058-paper58-owned-runtime'
    name: Actual restricted Paper58 HTTP and restart recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise isolated Paper58 and verify the evidence
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          tree=$(git rev-parse 'HEAD^{tree}')
          archive="$RUNNER_TEMP/ctcc-source.tar"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output="$archive" "$commit"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          options=(--archive "$archive" --archive-sha256 "$digest" --commit "$commit" --tree "$tree"
            --paper58-owned-runtime --output "$RUNNER_TEMP/ctcc-paper58-owned-runtime")
          python3 -m scripts.run_retained0017_reference_probe_v1 "${options[@]}"
          python3 -m scripts.run_retained0017_reference_probe_v1 "${options[@]}" --verify-only
      - name: Preserve exact source, actual test and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctcc-paper58-owned-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ctcc-source.tar
            ${{ runner.temp }}/ctcc-paper58-owned-runtime/*.json
            ${{ runner.temp }}/ctcc-paper58-owned-runtime/*.log
            ${{ runner.temp }}/ctcc-paper58-owned-runtime/test-results/*.xml
          if-no-files-found: error
          retention-days: 30
