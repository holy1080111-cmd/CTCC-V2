name: DB0057 G12 restricted writer smoke

on:
  push:
    branches: [work/db0057-g12-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g12-successor-smoke:
    if: github.ref == 'refs/heads/work/db0057-g12-smoke'
    name: DB0057 isolated G12 smoke ${{ matrix.cluster }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cluster: [1, 2]
    steps:
      - name: Checkout exact smoke source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run exact-source isolated G12 PostgreSQL smoke
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          tree=$(git rev-parse 'HEAD^{tree}')
          archive="$RUNNER_TEMP/ctcc-source.tar"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output="$archive" "$commit"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          python3 -m scripts.verify_current0057_hermetic \
            --archive "$archive" --archive-sha256 "$digest" \
            --commit "$commit" --tree "$tree" --g12-successor-smoke \
            --output "$RUNNER_TEMP/ctcc-g12-smoke"

      - name: Preserve scoped smoke and exact source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctcc-db0057-g12-smoke-${{ matrix.cluster }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ctcc-source.tar
            ${{ runner.temp }}/ctcc-g12-smoke/*.json
            ${{ runner.temp }}/ctcc-g12-smoke/*.log
            ${{ runner.temp }}/ctcc-g12-smoke/test-results/*.xml
            ${{ runner.temp }}/ctcc-g12-smoke/test-results/current0057-g12-profile-*.json
          if-no-files-found: error
          retention-days: 30
