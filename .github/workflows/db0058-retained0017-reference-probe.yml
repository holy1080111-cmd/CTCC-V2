name: Source58 fresh source17 catalog references

on:
  push:
    branches: [work/db0058-retained0017-reference-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-probe:
    if: github.ref == 'refs/heads/work/db0058-retained0017-reference-probe'
    name: Two actual fresh source17 catalog references
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact reference source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture two source-bound independent references
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          tree=$(git rev-parse 'HEAD^{tree}')
          archive="$RUNNER_TEMP/ctcc-source.tar"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output="$archive" "$commit"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          python3 -m scripts.run_retained0017_reference_probe_v1 \
            --archive "$archive" --archive-sha256 "$digest" \
            --commit "$commit" --tree "$tree" \
            --output "$RUNNER_TEMP/ctcc-source17-reference-probe"
      - name: Preserve exact reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctcc-source17-reference-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ctcc-source.tar
            ${{ runner.temp }}/ctcc-source17-reference-probe/*.json
            ${{ runner.temp }}/ctcc-source17-reference-probe/*.log
            ${{ runner.temp }}/ctcc-source17-reference-probe/test-results/*.xml
            ${{ runner.temp }}/ctcc-source17-reference-probe/test-results/*.json
          if-no-files-found: error
          retention-days: 30
