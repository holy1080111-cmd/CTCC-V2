name: DB0051 prospective cutover native catalog capture

on:
  workflow_dispatch:
  push:
    branches:
      - work/prospective-event-cutover-pg51-catalog-20261025

permissions:
  contents: read

jobs:
  prospective-cutover-native-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture actual PG17 catalog from exact source without trading or test acceptance
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          tree=$(git rev-parse 'HEAD^{tree}')
          archive="$RUNNER_TEMP/ctcc-prospective-cutover-source.tar"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output="$archive" "$commit"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          python3 -m scripts.diagnose_runtime_custody_postgres \
            --profile prospective-event-cutover-catalog-0051 \
            --archive "$archive" --archive-sha256 "$digest" \
            --commit "$commit" --tree "$tree" \
            --output "$RUNNER_TEMP/ctcc-prospective-cutover-capture"
      - name: Preserve actual source, actual catalog and safe capture metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ctcc-db0051-native-catalog-capture-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ctcc-prospective-cutover-source.tar
            ${{ runner.temp }}/ctcc-prospective-cutover-capture/export/*
          if-no-files-found: error
          retention-days: 30
