name: Source58 native owner storage diagnostic

on:
  push:
    branches: [work/db0058-native-storage-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-storage:
    if: github.ref == 'refs/heads/work/db0058-native-storage-diagnostic'
    name: Native55 and native57 components plus canonical55 full catalog DATA
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Diagnose original predicates and capture canonical55 catalog DATA
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          tree=$(git rev-parse 'HEAD^{tree}')
          archive="$RUNNER_TEMP/ctcc-source.tar"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output="$archive" "$commit"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          python3 -m scripts.run_retained0017_reference_probe_v1 \
            --native-storage-diagnostic \
            --archive "$archive" --archive-sha256 "$digest" \
            --commit "$commit" --tree "$tree" \
            --output "$RUNNER_TEMP/ctcc-native-storage-diagnostic"
      - name: Preserve exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctcc-native-storage-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ctcc-source.tar
            ${{ runner.temp }}/ctcc-native-storage-diagnostic/*.json
            ${{ runner.temp }}/ctcc-native-storage-diagnostic/*.log
            ${{ runner.temp }}/ctcc-native-storage-diagnostic/test-results/*.xml
            ${{ runner.temp }}/ctcc-native-storage-diagnostic/test-results/*.json
          if-no-files-found: error
          retention-days: 30
