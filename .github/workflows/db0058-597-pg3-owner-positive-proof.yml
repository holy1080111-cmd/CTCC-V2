name: Source58 two unchanged PostgreSQL owner migration checks

on:
  push:
    branches: [work/db0058-597-pg3-owner-positive-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-pg3-owner-positive:
    if: github.ref == 'refs/heads/work/db0058-597-pg3-owner-positive-proof'
    name: Actual DB0055 to 0056 and DB0057 to 0058 owner SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact validation topic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact subject and run both unchanged owner transaction cases
        shell: bash
        run: |
          set -euo pipefail
          subject=597574074b8b810f82cecbab050a235f92844663
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$subject"
          test "$(git rev-parse "$subject^{tree}")" = 'edb66252ac9f66f4b002c8e1ba77accdb3fb2e25'
          test "$(git show "$subject:MANIFEST.sha256" | sha256sum | cut -d ' ' -f 1)" = '62808edfafb1a898107c39d3678300a872a0ac504a43b96e5e2c09795ddbf5ba'
          diff -u <(printf '%s\n' \
            .github/workflows/db0058-597-pg3-owner-positive-proof.yml MANIFEST.sha256 \
            scripts/run_retained0017_reference_probe_v1.py) \
            <(git diff --name-only "$subject" "$commit")
          python3 scripts/manifest.py --check
          test "$(sha256sum tests/integration/test_native_owner_upgrade_0056_v2_pg.py | cut -d ' ' -f 1)" = 'f86b1eabc2aeccfc08478c163d6486c66f7b3704f2d2ab4b689e010c1fc1b9dc'
          test "$(sha256sum tests/integration/test_native_owner_upgrade_0058_pg.py | cut -d ' ' -f 1)" = '4f4eb9d3570f756ed6d335cea511a453993a686782f9381ece03d25b50842e8e'
          subject_archive="$RUNNER_TEMP/ctcc-subject.tar"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output="$subject_archive" "$subject"
          sha256sum "$subject_archive" | cut -d ' ' -f 1 > "$RUNNER_TEMP/ctcc-subject.sha256"
          tree=$(git rev-parse 'HEAD^{tree}')
          archive="$RUNNER_TEMP/ctcc-source.tar"
          git -c core.autocrlf=false -c core.eol=lf archive --format=tar --output="$archive" "$commit"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          options=(--archive "$archive" --archive-sha256 "$digest" --commit "$commit" --tree "$tree"
            --pg3-owner-positive --output "$RUNNER_TEMP/ctcc-pg3-owner-positive")
          python3 -m scripts.run_retained0017_reference_probe_v1 "${options[@]}"
          python3 -m scripts.run_retained0017_reference_probe_v1 "${options[@]}" --verify-only
      - name: Preserve exact source, case results and disposable cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctcc-pg3-owner-positive-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ctcc-source.tar
            ${{ runner.temp }}/ctcc-subject.tar
            ${{ runner.temp }}/ctcc-subject.sha256
            ${{ runner.temp }}/ctcc-pg3-owner-positive/*.json
            ${{ runner.temp }}/ctcc-pg3-owner-positive/*.log
            ${{ runner.temp }}/ctcc-pg3-owner-positive/test-results/*.xml
          if-no-files-found: error
          retention-days: 30
