name: Local analysis isolated Linux smoke

on:
  push:
    branches:
      - work/n267-local-analysis-exact-smoke-20261113

permissions:
  contents: read

jobs:
  local-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and check isolated analysis service
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          COMPOSE_DISABLE_ENV_FILE: "true"
        run: |
          set -euo pipefail
          umask 077
          unset DOCKER_HOST DOCKER_CONTEXT
          install_root="$(mktemp -d "$RUNNER_TEMP/ctcc-analysis-smoke.XXXXXXXX")"
          install_id="$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          project="ctcc-analysis-$install_id"
          port=38177
          export install_root install_id project port

          compose=(docker compose --env-file "$install_root/compose.env" --project-directory "$install_root" -p "$project" -f "$install_root/compose.yaml")
          cleanup() {
            if [[ "$project" =~ ^ctcc-analysis-[0-9a-f]{32}$ && "$install_root" == "$RUNNER_TEMP"/ctcc-analysis-smoke.* ]]; then
              "${compose[@]}" down --volumes --remove-orphans >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import os
          import secrets
          import sys
          from pathlib import Path

          from scripts.prepare_local_analysis_installation import (
              _render,
              _source_identity,
          )

          if sys.version_info[:2] != (3, 12):
              raise SystemExit("python_version_refused")
          root = Path(os.environ["install_root"]).resolve(strict=True)
          if root.parent != Path(os.environ["RUNNER_TEMP"]).resolve(strict=True):
              raise SystemExit("smoke_root_scope_refused")
          if root.stat().st_mode & 0o077:
              raise SystemExit("smoke_root_mode_refused")
          manifest_sha, template, commit, tree = _source_identity()
          if commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("source_commit_refused")
          password = secrets.token_hex(32).encode("ascii")
          token = secrets.token_urlsafe(48).encode("ascii")
          files = {
              "postgres_password": password,
              "database_url": b"postgresql+asyncpg://ctcc:" + password + b"@postgres:5432/ctcc",
              "api_token": token,
              "compose.env": b"",
          }
          for name, raw in files.items():
              path = root / name
              with path.open("xb") as handle:
                  handle.write(raw)
              path.chmod(0o644)
          compose = _render(
              template,
              root=root,
              install_id=os.environ["install_id"],
              source_manifest_sha256=manifest_sha,
              source_commit=commit,
              source_tree=tree,
              host_port=int(os.environ["port"]),
          )
          with (root / "compose.yaml").open("xb") as handle:
              handle.write(compose)
          PY

          "${compose[@]}" config --quiet
          "${compose[@]}" config --format json | python3 -c '
          import json, sys
          config = json.load(sys.stdin)
          expected = {
              "services": {"api", "ingress", "postgres", "redis"},
              "networks": {"analysis_internal", "analysis_ingress"},
              "volumes": {"analysis_socket", "postgres_data", "redis_data"},
              "secrets": {"analysis_api_token", "analysis_database_url", "analysis_postgres_password"},
          }
          if any(set(config.get(key, {})) != names for key, names in expected.items()):
              raise SystemExit("LOCAL_ANALYSIS_SMOKE_REFUSED compose_inventory")
          '
          "${compose[@]}" build --quiet
          "${compose[@]}" up -d --no-build

          python3 - <<'PY'
          import hashlib
          import http.client
          import json
          import os
          import subprocess
          import time
          import urllib.error
          from pathlib import Path

          root = Path(os.environ["install_root"])
          project = os.environ["project"]
          host_port = int(os.environ["port"])
          token = (root / "api_token").read_text("ascii")
          compose = [
              "docker", "compose", "--env-file", str(root / "compose.env"),
              "--project-directory", str(root), "-p", project,
              "-f", str(root / "compose.yaml"),
          ]

          def docker(*args: str) -> str:
              return subprocess.run(
                  ["docker", *args], check=True, capture_output=True,
                  timeout=30, text=True,
              ).stdout.strip()

          services = {"api", "ingress", "postgres", "redis"}
          internal_network = project + "_analysis_internal"
          ingress_network = project + "_analysis_ingress"
          socket_volume = project + "_analysis_socket"

          def one_inspect(kind: str, identity: str) -> dict:
              observed = json.loads(docker(kind, "inspect", identity))
              if type(observed) is not list or len(observed) != 1:
                  raise RuntimeError("inspect_inventory_mismatch")
              return observed[0]

          def assert_network(name: str, *, internal: bool, identities: set[str]) -> None:
              observed = one_inspect("network", name)
              if (
                  observed.get("Driver") != "bridge"
                  or observed.get("Internal") is not internal
                  or observed.get("Labels", {}).get("com.docker.compose.project") != project
                  or set((observed.get("Containers") or {}).keys()) != identities
              ):
                  raise RuntimeError("runtime_network_inventory_mismatch")

          def assert_no_published_port(container: dict) -> None:
              if (
                  (container["HostConfig"].get("PortBindings") or {})
                  or any((container["NetworkSettings"].get("Ports") or {}).values())
              ):
                  raise RuntimeError("service_host_port_present")

          def assert_ingress_binding(container: dict) -> None:
              expected = {"8000/tcp": [{"HostIp": "127.0.0.1", "HostPort": str(host_port)}]}
              if (container["HostConfig"].get("PortBindings") or {}) != expected:
                  raise RuntimeError("ingress_configured_binding_mismatch")
              active = {
                  key: value for key, value in (container["NetworkSettings"].get("Ports") or {}).items()
                  if value is not None
              }
              if active != expected:
                  raise RuntimeError("ingress_active_binding_mismatch")

          def inspect_services() -> dict:
              ids = docker(
                  "ps", "-a", "--no-trunc", "--filter",
                  f"label=com.docker.compose.project={project}", "--format", "{{.ID}}",
              ).splitlines()
              if len(ids) != len(services) or len(set(ids)) != len(services):
                  raise RuntimeError("runtime_service_inventory_mismatch")
              observed = {}
              for identity in ids:
                  container = one_inspect("container", identity)
                  kind = container["Config"]["Labels"].get("com.docker.compose.service")
                  if kind not in services or kind in observed or container.get("Id") != identity:
                      raise RuntimeError("runtime_service_inventory_mismatch")
                  if container["State"]["Running"] is not True:
                      raise RuntimeError("service_not_running")
                  expected_network = ingress_network if kind == "ingress" else internal_network
                  if set(container["NetworkSettings"]["Networks"]) != {expected_network}:
                      raise RuntimeError("service_network_mismatch")
                  if kind == "ingress":
                      assert_ingress_binding(container)
                  else:
                      assert_no_published_port(container)
                  host_config = container["HostConfig"]
                  if host_config.get("Privileged") is not False or host_config.get("CapAdd"):
                      raise RuntimeError("runtime_privilege_refused")
                  observed[kind] = container
              assert_network(
                  internal_network, internal=True,
                  identities={observed[kind]["Id"] for kind in ("api", "postgres", "redis")},
              )
              assert_network(ingress_network, internal=False, identities={observed["ingress"]["Id"]})
              return observed

          def request(
              path: str,
              *,
              payload: dict | None = None,
              raw_body: bytes | None = None,
              auth: bool = False,
              redirect_dashboard: bool = False,
          ):
              headers = {"Content-Type": "application/json"}
              if auth:
                  headers["X-CTCC-Token"] = token
              if payload is not None and raw_body is not None:
                  raise RuntimeError("request_body_conflict")
              data = raw_body if raw_body is not None else (
                  None if payload is None else json.dumps(payload).encode("ascii")
              )
              method = "GET" if data is None else "POST"
              with_loopback = http.client.HTTPConnection("127.0.0.1", host_port, timeout=4)
              try:
                  with_loopback.request(method, path, body=data, headers=headers)
                  with with_loopback.getresponse() as response:
                      status = response.status
                      location = response.getheader("Location")
                      body = response.read(1_000_001)
                  if len(body) > 1_000_000:
                      raise RuntimeError("http_body_size_refused")
              finally:
                  with_loopback.close()
              if status >= 400:
                  raise urllib.error.HTTPError(path, status, "", None, None)
              if 300 <= status < 400:
                  if not (
                      redirect_dashboard and status == 307 and path == "/dashboard"
                      and location == "/dashboard/local-analysis" and not auth
                  ):
                      raise RuntimeError("http_redirect_refused")
                  return request(location)
              return status, body

          def ready() -> dict:
              for _ in range(120):
                  try:
                      status, raw = request("/readiness")
                      if status == 200:
                          detail = json.loads(raw)
                          if (
                              detail.get("status") != "ready"
                              or detail.get("blockers") != []
                              or detail.get("database", {}).get("ok") is not True
                              or detail.get("redis", {}).get("ok") is not True
                          ):
                              raise RuntimeError("readiness_detail_refused")
                          return detail
                  except (OSError, http.client.HTTPException):
                      pass
                  time.sleep(2)
              raise RuntimeError("readiness_timeout")

          def assert_socket_mounts(containers: dict) -> None:
              volume = one_inspect("volume", socket_volume)
              if (
                  volume.get("Driver") != "local" or volume.get("Options")
                  or volume.get("Labels", {}).get("com.docker.compose.project") != project
              ):
                  raise RuntimeError("runtime_socket_volume_mismatch")
              mount_paths = {
                  "api": {
                      "/run/ctcc-analysis", "/run/secrets/analysis_database_url",
                      "/run/secrets/analysis_api_token",
                  },
                  "ingress": {"/run/ctcc-analysis"},
                  "postgres": {"/var/lib/postgresql/data", "/run/secrets/analysis_postgres_password"},
                  "redis": {"/data"},
              }
              for kind, destinations in mount_paths.items():
                  mounts = containers[kind]["Mounts"]
                  by_path = {mount["Destination"]: mount for mount in mounts}
                  if len(mounts) != len(destinations) or set(by_path) != destinations:
                      raise RuntimeError("runtime_mount_inventory_mismatch")
                  for path, mount in by_path.items():
                      if path.startswith("/run/secrets/"):
                          source = root / path.rsplit("/", 1)[-1].removeprefix("analysis_")
                          if (
                              mount.get("Type") != "bind"
                              or mount.get("Source") != str(source)
                              or mount.get("RW") is not False
                          ):
                              raise RuntimeError("runtime_secret_mount_mismatch")
                      else:
                          suffix = {
                              "/run/ctcc-analysis": "analysis_socket",
                              "/var/lib/postgresql/data": "postgres_data",
                              "/data": "redis_data",
                          }[path]
                          if (
                              mount.get("Type") != "volume"
                              or mount.get("Name") != f"{project}_{suffix}"
                              or mount.get("RW") is not (kind != "ingress")
                          ):
                              raise RuntimeError("runtime_socket_volume_mismatch")

          def assert_socket_endpoint(api: dict, ingress: dict, image: dict) -> None:
              api_command = api["Config"]["Cmd"]
              api_entrypoint = api["Config"].get("Entrypoint")
              if (
                  api_entrypoint != ["/bin/sh", "-ec"]
                  or type(api_command) is not list or len(api_command) != 1
                  or api_command[0].splitlines()[-1] != (
                      "exec uvicorn app.main:app --uds /run/ctcc-analysis/api.sock "
                      "--no-proxy-headers --workers 1"
                  )
              ):
                  raise RuntimeError("runtime_api_socket_command_mismatch")
              host = ingress["HostConfig"]
              config = ingress["Config"]
              if (
                  ingress["Image"] != api["Image"]
                  or config.get("User") != "ctcc"
                  or config.get("User") != image["Config"].get("User")
                  or config.get("Entrypoint") != ["python", "-B", "-m", "scripts.local_analysis_ingress"]
                  or config.get("Cmd") not in (None, [])
                  or sorted(config.get("Env") or []) != sorted(image["Config"].get("Env") or [])
                  or host.get("ReadonlyRootfs") is not True
                  or host.get("CapDrop") != ["ALL"]
                  or host.get("SecurityOpt") != ["no-new-privileges:true"]
              ):
                  raise RuntimeError("runtime_ingress_command_or_privileges_mismatch")
              socket_check = (
                  "import os,stat; "
                  "sock = os.lstat('/run/ctcc-analysis/api.sock'); "
                  "assert stat.S_ISSOCK(sock.st_mode); print(sock.st_dev, sock.st_ino)"
              )
              socket_identities = {
                  subprocess.run(
                      [*compose, "exec", "-T", kind, "python", "-B", "-c", socket_check],
                      check=True, capture_output=True, timeout=10,
                  ).stdout.strip()
                  for kind in ("api", "ingress")
              }
              if len(socket_identities) != 1 or not all(socket_identities):
                  raise RuntimeError("runtime_shared_socket_identity_mismatch")

          phase = "host_readiness"
          substep = "await_ready"
          try:
              ready()
              phase = "runtime_identity"
              substep = "inspect_topology"
              containers = inspect_services()
              api = containers["api"]
              ingress = containers["ingress"]
              substep = "inspect_image"
              image = one_inspect("image", api["Image"])
              if image.get("Id") != api["Image"]:
                  raise RuntimeError("image_id_mismatch")
              labels = image["Config"]["Labels"]
              if labels["org.opencontainers.image.revision"] != os.environ["GITHUB_SHA"]:
                  raise RuntimeError("image_commit_mismatch")
              expected_tree = subprocess.run(
                  ["git", "rev-parse", "HEAD^{tree}"], check=True,
                  capture_output=True, timeout=10, text=True,
              ).stdout.strip()
              if labels["org.ctcc.source.tree"] != expected_tree:
                  raise RuntimeError("image_tree_mismatch")
              substep = "inspect_runtime_env"
              configured = dict(
                  item.split("=", 1) for item in api["Config"]["Env"] if "=" in item
              )
              if configured.get("ENVIRONMENT") != "production" or configured.get("TRADING_MODE") != "analysis_only":
                  raise RuntimeError("runtime_mode_mismatch")
              for flag in (
                  "AUTO_TRADE", "LIVE_TRADING", "OKX_DEMO_ENABLED",
                  "OKX_DEMO_ALLOW_ORDER_WRITES", "OKX_DEMO_AUTO_EXECUTION",
                  "OKX_LIVE_ENABLED", "OKX_LIVE_ALLOW_ORDER_WRITES",
                  "OKX_LIVE_AUTO_EXECUTION", "OKX_WS_ENABLED",
                  "PAPER_AUTO_EXECUTION", "NOTION_OUTBOX_ENABLED",
                  "SUBMISSION_OUTBOX_ENABLED",
              ):
                  if configured.get(flag) != "false":
                      raise RuntimeError("runtime_execution_flag_mismatch")
              if configured.get("PAPER_PERSISTENCE_ENABLED") != "true":
                  raise RuntimeError("runtime_paper_persistence_missing")
              if configured.get("CTCC_LOCAL_ANALYSIS_ONLY_V1") != "true":
                  raise RuntimeError("runtime_local_profile_missing")
              if (
                  "API_TOKEN" in configured or "DATABASE_URL" in configured
                  or any(configured.get(key) for key in (
                      "OKX_DEMO_API_KEY", "OKX_DEMO_API_SECRET", "OKX_DEMO_API_PASSPHRASE",
                      "OKX_LIVE_API_KEY", "OKX_LIVE_API_SECRET", "OKX_LIVE_API_PASSPHRASE",
                      "NOTION_OUTBOX_TOKEN_FILE",
                  ))
              ):
                  raise RuntimeError("runtime_secret_config_exposed")
              substep = "inspect_socket_custody"
              assert_socket_mounts(containers)
              assert_socket_endpoint(api, ingress, image)
              api_started_at = api["State"]["StartedAt"]
              ingress_started_at = ingress["State"]["StartedAt"]

              phase = "local_http"
              substep = "route_checks"
              status, dashboard = request("/dashboard", redirect_dashboard=True)
              if status != 200 or b"CTCC" not in dashboard:
                  raise RuntimeError("dashboard_refused")
              status, local_page = request("/dashboard/local-analysis")
              if status != 200 or b"MarketSnapshot" not in local_page:
                  raise RuntimeError("local_page_refused")
              for path in (
                  "/docs", "/openapi.json", "/api/okx-demo/status",
                  "/api/okx-live/status", "/api/analysis/BTC-USDT-SWAP",
              ):
                  try:
                      request(path)
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise RuntimeError("legacy_route_exposed") from None
                  else:
                      raise RuntimeError("legacy_route_exposed")
              for path in ("/api/paper/reset", "/api/okx-demo/orders"):
                  try:
                      request(path, payload={}, auth=True)
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise RuntimeError("write_route_exposed") from None
                  else:
                      raise RuntimeError("write_route_exposed")
              try:
                  request("/api/paper/account")
              except urllib.error.HTTPError as exc:
                  if exc.code != 401:
                      raise RuntimeError("paper_unauthorized_guard_refused") from None
              else:
                  raise RuntimeError("paper_unauthorized_guard_missing")

              phase = "offline_snapshot"
              fixture_command = (
                  "from tests.unit.test_qualification_data import market; "
                  "print(market.__wrapped__().model_dump_json())"
              )
              fixture_result = subprocess.run(
                  [*compose, "exec", "-T", "api", "python", "-B", "-c", fixture_command],
                  check=True, capture_output=True, timeout=40,
              )
              fixture = fixture_result.stdout.strip()
              if not fixture or len(fixture) > 1_000_000:
                  raise RuntimeError("synthetic_snapshot_size_refused")
              status, raw = request(
                  "/api/analysis/snapshot", raw_body=fixture, auth=True
              )
              snapshot = json.loads(raw)
              if (
                  status != 200
                  or snapshot.get("input_sha256") != hashlib.sha256(fixture).hexdigest()
                  or snapshot.get("source_authenticity_verified") is not False
                  or snapshot.get("execution_authority") is not False
                  or snapshot.get("analysis", {}).get("trade_ready") is not False
                  or "imported_snapshot_unverified" not in snapshot.get("analysis", {}).get("blockers", [])
                  or set(snapshot.get("analysis", {}).get("timeframe_analyses", {})) != {"4H", "1H", "15m", "5m"}
              ):
                  raise RuntimeError("offline_snapshot_contract_refused")

              phase = "paper_persistence"
              status, raw = request(
                  "/api/paper/orders",
                  payload={
                      "symbol": "BTC-USDT-SWAP", "side": "long",
                      "quantity": "0.1", "reference_price": "100",
                      "stop_loss": "95", "take_profit": "110",
                      "order_type": "market", "risk_decision": "approved",
                      "strategy": "local_analysis_smoke", "score": 80,
                  },
                  auth=True,
              )
              order = json.loads(raw)
              if status != 201 or order["status"] != "filled":
                  raise RuntimeError("paper_order_refused")
              order_id = order["id"]
              substep = "restart_api"
              subprocess.run(
                  [*compose, "restart", "--no-deps", "api"], check=True,
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=45,
              )
              ready()
              substep = "inspect_after_restart"
              restarted = inspect_services()
              if (
                  any(restarted[kind]["Id"] != containers[kind]["Id"] for kind in services)
                  or restarted["api"]["Image"] != api["Image"]
                  or restarted["api"]["State"]["StartedAt"] <= api_started_at
                  or restarted["ingress"]["State"]["StartedAt"] != ingress_started_at
              ):
                  raise RuntimeError("runtime_api_restart_identity_mismatch")
              assert_socket_mounts(restarted)
              assert_socket_endpoint(restarted["api"], restarted["ingress"], image)
              status, raw = request(f"/api/paper/orders/{order_id}", auth=True)
              replay = json.loads(raw)
              if status != 200 or replay["id"] != order_id or replay["status"] != "filled":
                  raise RuntimeError("paper_restart_recovery_refused")
              status, raw = request("/api/paper/account", auth=True)
              if status != 200 or json.loads(raw).get("open_positions") != 1:
                  raise RuntimeError("paper_account_recovery_refused")

              result = {
                  "schema": "ctcc.local_analysis.linux_compose_smoke.v2",
                  "status": "CANDIDATE_AWAITING_CLEANUP",
                  "source_commit": os.environ["GITHUB_SHA"],
                  "source_tree": expected_tree,
                  "manifest_sha256": hashlib.sha256(Path("MANIFEST.sha256").read_bytes()).hexdigest(),
                  "image_id": api["Image"],
                  "ingress_image_id": ingress["Image"],
                  "loopback_host_reachable": True,
                  "internal_network_verified": True,
                  "ingress_separate_loopback_only_verified": True,
                  "exact_shared_unix_socket_verified": True,
                  "ingress_has_no_credentials_or_extra_capabilities": True,
                  "same_ingress_survived_api_process_restart": True,
                  "paper_auth_guard_verified": True,
                  "paper_restart_recovery_verified": True,
                  "offline_snapshot_sha256": hashlib.sha256(fixture).hexdigest(),
                  "offline_execution_authority": False,
                  "legacy_routes_denied": True,
                  "exchange_credentials_used": False,
                  "paper_orders_created": 1,
              }
              (root / "smoke-candidate.json").write_text(
                  json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="ascii",
              )
          except Exception as exc:
              allowed = {
                  "image_id_mismatch", "image_commit_mismatch", "image_tree_mismatch",
                  "readiness_timeout", "readiness_detail_refused", "dashboard_refused",
                  "local_page_refused", "legacy_route_exposed", "write_route_exposed",
                  "paper_unauthorized_guard_refused", "paper_unauthorized_guard_missing",
                  "synthetic_snapshot_size_refused", "offline_snapshot_contract_refused",
                  "paper_order_refused", "paper_restart_recovery_refused",
                  "paper_account_recovery_refused",
                  "runtime_mode_mismatch", "runtime_local_profile_missing",
                  "runtime_execution_flag_mismatch", "runtime_paper_persistence_missing",
                  "runtime_secret_config_exposed", "service_network_mismatch",
                  "runtime_network_inventory_mismatch", "runtime_service_inventory_mismatch",
                  "inspect_inventory_mismatch", "runtime_privilege_refused", "service_not_running",
                  "service_host_port_present", "ingress_configured_binding_mismatch",
                  "ingress_active_binding_mismatch", "runtime_api_socket_command_mismatch",
                  "runtime_ingress_command_or_privileges_mismatch", "runtime_socket_volume_mismatch",
                  "runtime_mount_inventory_mismatch", "runtime_secret_mount_mismatch",
                  "runtime_shared_socket_identity_mismatch",
                  "runtime_api_restart_identity_mismatch", "http_body_size_refused",
                  "http_redirect_refused",
              }
              code = exc.args[0] if type(exc) is RuntimeError and exc.args and exc.args[0] in allowed else "unexpected_refusal"
              fixed_substeps = {
                  "await_ready", "inspect_topology", "inspect_image",
                  "inspect_runtime_env", "inspect_socket_custody", "route_checks",
                  "restart_api", "inspect_after_restart",
              }
              fixed_kinds = {
                  "RuntimeError", "KeyError", "TypeError", "AttributeError",
                  "CalledProcessError", "TimeoutExpired", "JSONDecodeError",
                  "HTTPError", "URLError", "IndexError", "ValueError",
              }
              kind = type(exc).__name__
              if kind not in fixed_kinds:
                  kind = "other"
              state, health, exit_code = "unknown", "unknown", "unknown"
              try:
                  diagnostic_id = subprocess.run(
                      [*compose, "ps", "-a", "-q", "api"], check=True,
                      capture_output=True, timeout=10, text=True,
                  ).stdout.strip()
                  if diagnostic_id:
                      diagnostic = json.loads(docker("container", "inspect", diagnostic_id))[0]
                      observed = diagnostic.get("State") or {}
                      if observed.get("Status") in {"created", "running", "restarting", "exited", "paused", "dead", "removing"}:
                          state = observed["Status"]
                      if (observed.get("Health") or {}).get("Status") in {"starting", "healthy", "unhealthy"}:
                          health = observed["Health"]["Status"]
                      if type(observed.get("ExitCode")) is int and 0 <= observed["ExitCode"] <= 255:
                          exit_code = str(observed["ExitCode"])
              except Exception:
                  pass
              print(
                  "LOCAL_ANALYSIS_SMOKE_REFUSED", phase,
                  substep if substep in fixed_substeps else "unknown_substep",
                  code, kind, state, health, exit_code,
              )
              raise SystemExit(1) from None
          PY

          "${compose[@]}" down --volumes --remove-orphans
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          root = Path(os.environ["install_root"])
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          project = os.environ["project"]
          if (
              root.resolve(strict=True).parent != runner_temp
              or not re.fullmatch(r"ctcc-analysis-[0-9a-f]{32}", project)
              or not root.name.startswith("ctcc-analysis-smoke.")
              or root.is_symlink()
          ):
              raise SystemExit("cleanup_scope_refused")

          def docker(*args: str) -> set[str]:
              output = subprocess.run(
                  ["docker", *args], check=True, capture_output=True,
                  timeout=20, text=True,
              ).stdout
              return set(output.splitlines())

          containers = docker(
              "ps", "-a", "--filter", f"label=com.docker.compose.project={project}",
              "--format", "{{.ID}}",
          )
          volumes = docker("volume", "ls", "--format", "{{.Name}}")
          networks = docker("network", "ls", "--format", "{{.Name}}")
          if (
              containers
              or project + "_postgres_data" in volumes
              or project + "_redis_data" in volumes
              or project + "_analysis_socket" in volumes
              or project + "_analysis_internal" in networks
              or project + "_analysis_ingress" in networks
          ):
              raise SystemExit("owned_cleanup_refused")

          members = {
              "postgres_password", "database_url", "api_token", "compose.env",
              "compose.yaml", "smoke-candidate.json",
          }
          if {item.name for item in root.iterdir()} != members:
              raise SystemExit("private_root_members_refused")
          if any(item.is_symlink() or not item.is_file() for item in root.iterdir()):
              raise SystemExit("private_root_member_identity_refused")
          candidate = json.loads((root / "smoke-candidate.json").read_bytes())
          if (
              candidate.get("schema") != "ctcc.local_analysis.linux_compose_smoke.v2"
              or candidate.get("status") != "CANDIDATE_AWAITING_CLEANUP"
              or candidate.get("source_commit") != os.environ["GITHUB_SHA"]
              or candidate.get("internal_network_verified") is not True
              or candidate.get("ingress_separate_loopback_only_verified") is not True
              or candidate.get("exact_shared_unix_socket_verified") is not True
              or candidate.get("ingress_has_no_credentials_or_extra_capabilities") is not True
              or candidate.get("same_ingress_survived_api_process_restart") is not True
              or candidate.get("image_id") != candidate.get("ingress_image_id")
              or candidate.get("paper_restart_recovery_verified") is not True
              or candidate.get("offline_execution_authority") is not False
          ):
              raise SystemExit("candidate_readback_refused")
          shutil.rmtree(root)
          if root.exists():
              raise SystemExit("private_root_cleanup_refused")
          candidate.update(
              status="PASS", owned_container_volume_network_cleanup_verified=True,
              synthetic_secret_files_removed=True,
          )
          proof = runner_temp / "ctcc-local-analysis-smoke-proof.json"
          with proof.open("x", encoding="ascii") as handle:
              handle.write(json.dumps(candidate, sort_keys=True, separators=(",", ":")) + "\n")
          print("LOCAL_ANALYSIS_SMOKE_PASS")
          PY

      - name: Upload redacted smoke proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctcc-local-analysis-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/ctcc-local-analysis-smoke-proof.json
          if-no-files-found: ignore
