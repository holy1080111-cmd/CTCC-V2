[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ctcc-v2"
version = "1.6.8"
description = "CTCC V2 controlled OKX Live reconciliation and fail-closed execution"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.50.0",
  "pydantic-settings==2.14.2",
  "SQLAlchemy[asyncio]==2.0.51",
  "asyncpg==0.31.0",
  "alembic==1.18.5",
  "redis>=7.4,<9",
  "httpx==0.28.1",
  "websockets==17.0.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "websockets==17.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "integration: requires PostgreSQL and the migrated CTCC database",
]

[tool.setuptools.packages.find]
include = ["app*"]
